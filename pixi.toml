[workspace]
name = "pydantic-settings-sops"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
preview = ["pixi-build"]

[package]
name = "pydantic-settings-sops"
[package.build.backend]
name = "pixi-build-python"
version = "*"
[package.host-dependencies]
python = ">=3.12"
hatchling = "*"
uv = "*"
[package.run-dependencies]
python = ">=3.12"
age = ">=1.2.0,<2"
go-sops = ">=3.9.1,<4"
pydantic-settings = ">=2.9.1,<3"
sopsy = ">=1.0.1,<2"

[dependencies]
pydantic-settings-sops = { path = "." }

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
mypy = "*"
[feature.test.tasks]
test = { cmd = "pytest", env = { SOPS_AGE_KEY_FILE = "tests/resources/key.txt" } }
test-coverage = { cmd = "pytest --cov=pydantic_settings_sops --cov-report=xml --cov-report=term-missing", env = { SOPS_AGE_KEY_FILE = "tests/resources/key.txt" } }

[feature.build.dependencies]
python = "*"
hatchling = "*"
python-build = "*"
twine = ">=6"
[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
lefthook = "*"
ruff = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"
[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test", "build", "lint"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
